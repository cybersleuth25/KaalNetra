<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Outer Astronomical Ring -->
  <circle cx="32" cy="32" r="30" stroke="#B99652" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="32" cy="32" r="26" stroke="#B99652" stroke-width="1" />
  
  <!-- Four Cardinal Diamond Points -->
  <polygon points="32,2 34.5,8 32,10 29.5,8" fill="#D1B16A"/>
  <polygon points="32,62 34.5,56 32,54 29.5,56" fill="#D1B16A"/>
  <polygon points="2,32 8,34.5 10,32 8,29.5" fill="#D1B16A"/>
  <polygon points="62,32 56,34.5 54,32 56,29.5" fill="#D1B16A"/>
  
  <!-- Eye of Time (Kaal-Netra) Outer Curve -->
  <path d="M12 32 C18 20, 46 20, 52 32 C46 44, 18 44, 12 32 Z" 
        stroke="#D1B16A" stroke-width="2" fill="#1A1815"/>
  
  <!-- Inner Iris Ring -->
  <circle cx="32" cy="32" r="8" stroke="#B99652" stroke-width="1.5" fill="#11110F"/>
  <circle cx="32" cy="32" r="3.5" fill="#D1B16A"/>
  
  <!-- Crosshairs / Temporal Compass Ray -->
  <line x1="32" y1="14" x2="32" y2="50" stroke="#B99652" stroke-width="0.75" stroke-dasharray="2 2"/>
  <line x1="14" y1="32" x2="50" y2="32" stroke="#B99652" stroke-width="0.75" stroke-dasharray="2 2"/>
</svg>